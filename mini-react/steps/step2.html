<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>계단 2 — 상태 바꾸고 다시 그리기</title>
</head>
<body>
  <p id="num"></p>
  <button id="btn">+1</button>

  <script>
    let count = 0; // 상태. 함수 바깥(전역)에 둬서 사라지지 않는다

    // 화면 그리기: 지금 count 값을 p 안에 적는다
    function draw() {
      document.getElementById("num").textContent = count;
      console.log("그림: count =", count);
    }

    // 누르면: ① 상태 바꾸기 → ② 다시 그리기
    function whenClicked() {
      count = count + 1;
      draw(); // ← 이 줄을 빼면 count는 오르지만 화면은 그대로 (11/9 실험: count 11, 화면 0)
    }

    document.getElementById("btn").onclick = whenClicked;
    draw(); // 처음 한 번 그리기
  </script>
</body>
</html>
