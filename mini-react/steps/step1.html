<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>계단 1 — 버튼 누르면 함수 실행</title>
</head>
<body>
  <button id="btn">+1</button>

  <script>
    // 1) 누르면 실행할 함수를 만든다 (아직 실행 안 함)
    function whenClicked() {
      console.log("눌림");
    }

    // 2) 버튼을 찾는다
    const btn = document.getElementById("btn");

    // 3) 버튼의 onclick 칸에 함수를 넣어 둔다
    //    whenClicked 뒤에 () 가 없다 = 실행하지 않고 "함수 자체"를 넘긴다
    //    (PintOS: thread_create(..., my_func, ...) 에서 my_func 를 넘기는 것과 같다)
    btn.onclick = whenClicked;

    console.log("준비 끝");
  </script>
</body>
</html>
